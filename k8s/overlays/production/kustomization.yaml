apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# CI rewrites the tags on each deploy:
#   kustomize edit set image \
#     backend=$REGISTRY/yatru-sathi-backend:$SHA \
#     frontend=$REGISTRY/yatru-sathi-frontend:$SHA \
#     chatbot=$REGISTRY/yatru-sathi-chatbot:$SHA
# The newName values below are placeholders — replace <ACCOUNT_ID>/<REGION>
# with `terraform output ecr_registry`, or just let CI set them.
images:
  - name: backend
    newName: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/yatru-sathi-backend
    newTag: latest
  - name: frontend
    newName: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/yatru-sathi-frontend
    newTag: latest
  - name: chatbot
    newName: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/yatru-sathi-chatbot
    newTag: latest

# After the first deploy, once the ALB DNS name is known, narrow the Django
# host allow-list from "*" and set the real CORS/CSRF origin.
patches:
  - target:
      kind: ConfigMap
      name: yatrusathi-config
    patch: |
      - op: replace
        path: /data/CORS_ALLOWED_ORIGINS
        value: "https://REPLACE_WITH_ALB_DNS"
      - op: replace
        path: /data/CSRF_TRUSTED_ORIGINS
        value: "https://REPLACE_WITH_ALB_DNS"
