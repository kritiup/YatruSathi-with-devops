apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app.kubernetes.io/name: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: backend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend }
    spec:
      # Run schema migrations once before the app container starts. Idempotent;
      # for zero-downtime multi-replica rollouts promote this to a pre-deploy Job.
      initContainers:
        - name: migrate
          image: backend
          command: ["python", "manage.py", "migrate", "--no-input"]
          envFrom:
            - configMapRef: { name: yatrusathi-config }
          env:
            - name: SECRET_KEY
              valueFrom: { secretKeyRef: { name: yatrusathi-app-secrets, key: DJANGO_SECRET_KEY } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: yatrusathi-app-secrets, key: DATABASE_URL } }
      containers:
        - name: backend
          image: backend
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: yatrusathi-config }
          env:
            - name: SECRET_KEY
              valueFrom: { secretKeyRef: { name: yatrusathi-app-secrets, key: DJANGO_SECRET_KEY } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: yatrusathi-app-secrets, key: DATABASE_URL } }
            - name: RESEND_API_KEY
              valueFrom: { secretKeyRef: { name: yatrusathi-app-secrets, key: RESEND_API_KEY } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: yatrusathi-app-secrets, key: DJANGO_ADMIN_PASSWORD } }
          readinessProbe:
            httpGet:
              path: /api/
              port: 8000
              httpHeaders:
                - { name: X-Forwarded-Proto, value: https }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/
              port: 8000
              httpHeaders:
                - { name: X-Forwarded-Proto, value: https }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app.kubernetes.io/name: backend }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
