# Non-secret runtime config. Secrets (DATABASE_URL, SECRET_KEY, API keys)
# arrive separately via the ExternalSecret -> `yatrusathi-app-secrets`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: yatrusathi-config
data:
  # ── Django backend ────────────────────────────────────────────────
  DEBUG: "False"
  # Behind a single trusted ALB. Narrow this to the real host once known
  # (overlay patch) — see k8s/overlays/production.
  ALLOWED_HOSTS: "*"
  CORS_ALLOWED_ORIGINS: "https://REPLACE_WITH_APP_HOST"
  CSRF_TRUSTED_ORIGINS: "https://REPLACE_WITH_APP_HOST"
  # TLS terminates at the ALB; the controller sets X-Forwarded-Proto.
  SECURE_SSL_REDIRECT: "False"
  DB_SSL_REQUIRE: "True"
  WEB_CONCURRENCY: "3"
  DJANGO_SETTINGS_MODULE: "backend.settings"
  # Outbound email (OTP + password reset). The API key itself is a secret and
  # arrives via the ExternalSecret; the sender address is not.
  #
  # This MUST be an address on a domain verified at https://resend.com/domains.
  # Resend's sandbox sender (onboarding@resend.dev) is refused for every
  # recipient except the API key owner, which breaks password reset for real
  # users. `manage.py check --deploy` warns if this is left at the sandbox value.
  RESEND_FROM_EMAIL: "no-reply@REPLACE_WITH_VERIFIED_DOMAIN"

  # ── AI chatbot ───────────────────────────────────────────────────
  GROQ_MODEL: "llama-3.3-70b-versatile"
  GUNICORN_THREADS: "50"
  # Set to a redis:// URL (e.g. ElastiCache) to run chatbot with >1 replica.
  REDIS_URL: ""

  # ── Error tracking (backend + chatbot) ──────────────────────────
  # A Sentry DSN is not a credential (it only permits sending events).
  # Blank ⇒ disabled; set the real DSN(s) here per environment.
  SENTRY_DSN: ""
  SENTRY_ENVIRONMENT: "production"
