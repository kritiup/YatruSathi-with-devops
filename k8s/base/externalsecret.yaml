# Pulls the "yatrusathi/app" Secrets Manager secret (created by Terraform in
# infra/terraform/secrets.tf) into a Kubernetes Secret the pods consume.
#
# A namespaced SecretStore (not a ClusterSecretStore) so the namespace-scoped
# CI deploy role can create it. Requires the External Secrets Operator
# (installed via Terraform addons.tf) with its IRSA role bound to
# serviceaccount external-secrets/external-secrets.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      # Overlay patches this to the real region.
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: yatrusathi-app-secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: yatrusathi-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: yatrusathi/app, property: DATABASE_URL }
    - secretKey: DJANGO_SECRET_KEY
      remoteRef: { key: yatrusathi/app, property: DJANGO_SECRET_KEY }
    - secretKey: CHATBOT_SECRET_KEY
      remoteRef: { key: yatrusathi/app, property: CHATBOT_SECRET_KEY }
    - secretKey: GROQ_API_KEY
      remoteRef: { key: yatrusathi/app, property: GROQ_API_KEY }
    - secretKey: RESEND_API_KEY
      remoteRef: { key: yatrusathi/app, property: RESEND_API_KEY }
    - secretKey: DJANGO_ADMIN_PASSWORD
      remoteRef: { key: yatrusathi/app, property: DJANGO_ADMIN_PASSWORD }
