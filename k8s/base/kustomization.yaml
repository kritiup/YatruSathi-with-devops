apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: yatrusathi

resources:
  # The namespace itself is created by Terraform (kubernetes_namespace) so the
  # namespace-scoped CI deploy role never needs cluster-level create rights.
  - configmap.yaml
  - externalsecret.yaml
  - backend.yaml
  - frontend.yaml
  - chatbot.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: yatrusathi
    includeSelectors: false
