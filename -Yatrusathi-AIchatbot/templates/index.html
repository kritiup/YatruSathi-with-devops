<!DOCTYPE html>
<html>
<head>
<title>AI Chatbot</title>

<style>

/* Floating Button */
.chat-toggle{
    position:fixed;
    bottom:25px;
    right:25px;
    width:65px;
    height:65px;
    background:#4f46e5;
    color:white;
    border-radius:50%;
    border:none;
    font-size:26px;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,0.2);
}

/* Chat Window */
.chat-box{
    position:fixed;
    bottom:100px;
    right:25px;
    width:360px;
    height:520px;
    background:white;
    border-radius:18px;
    box-shadow:0 10px 40px rgba(0,0,0,0.2);
    display:none;
    flex-direction:column;
    overflow:hidden;
}

/* Header */
.header{
    background:#4f46e5;
    color:white;
    padding:15px;
    font-size:18px;
}

/* Messages */
#chat{
    flex:1;
    padding:12px;
    overflow-y:auto;
}

.user{
    text-align:right;
    margin:8px;
}

.bot{
    text-align:left;
    margin:8px;
}

.msg{
    display:inline-block;
    padding:10px 14px;
    border-radius:14px;
    max-width:75%;
}

.user .msg{
    background:#4f46e5;
    color:white;
}

.bot .msg{
    background:#e5e7eb;
}

/* Input */
.input-area{
    display:flex;
    border-top:1px solid #ddd;
}

input{
    flex:1;
    padding:12px;
    border:none;
}

button.send{
    background:#4f46e5;
    color:white;
    border:none;
    padding:12px;
    cursor:pointer;
}

</style>
</head>

<body>

<button class="chat-toggle" onclick="toggleChat()">💬</button>

<div class="chat-box" id="chatbox">

<div class="header">
🤖 AI Assistant
</div>

<div id="chat"></div>

<div class="input-area">
<input id="message" placeholder="Type a message..." />
<button class="send" onclick="sendMessage()">Send</button>
</div>

</div>


<script>

function toggleChat(){
    let box = document.getElementById("chatbox");
    box.style.display = box.style.display === "flex" ? "none" : "flex";
}

async function sendMessage(){

let input = document.getElementById("message");
let text = input.value;

if(!text) return;

let chat = document.getElementById("chat");

/* User message */
chat.innerHTML += `
<div class="user">
   <div class="msg">${text}</div>
</div>
`;

input.value="";

/* Call Flask */
let response = await fetch("/get?msg=" + encodeURIComponent(text));
let data = await response.json();

/* Bot reply */
chat.innerHTML += `
<div class="bot">
   <div class="msg">${data.reply}</div>
</div>
`;

chat.scrollTop = chat.scrollHeight;
}

/* Enter key */
document.getElementById("message")
.addEventListener("keypress", function(e){
    if(e.key==="Enter"){
        sendMessage();
    }
});

</script>

</body>
</html>
