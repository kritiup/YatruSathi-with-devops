[flake8]
# Black owns line length and E203/W503 (both conflict with black's style).
max-line-length = 88
extend-ignore = E203,E501,W503
exclude =
    .git,
    __pycache__,
    migrations,
    .venv,
    venv,
    build,
    dist
# Keep pyflakes (F-codes) — they catch real problems (unused imports/names).
