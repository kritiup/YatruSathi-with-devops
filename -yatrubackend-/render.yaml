services:
  # Django Backend Service
  - type: web
    name: yatrusathi-backend
    env: python
    region: oregon # Free tier available region
    plan: free # Free tier
    branch: main # Deploy from main branch
    buildCommand: 'scripts/build.sh'
    startCommand: 'scripts/start.sh'
    # NOTE: the app requires PostgreSQL and will not start without it. Add a
    # Render PostgreSQL instance (or any managed Postgres) and set DATABASE_URL
    # below from its connection string — Render's filesystem is ephemeral, and
    # there is no local-file fallback.
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      # Required. Point at a managed Postgres; sync:false keeps the DSN out of
      # this file — set the value in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_REQUIRE
        value: True
    autoDeploy: true # Auto-deploy on git push
