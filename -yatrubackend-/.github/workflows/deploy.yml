name: Deploy to Render

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Manual trigger

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Django checks
        run: |
          python manage.py check
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: True
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      
      - name: Run migrations check
        run: |
          python manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: True
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Render
        run: |
          echo "✅ Code pushed to main branch"
          echo "🚀 Render will automatically deploy via render.yaml"
          echo "📊 Check deployment status at: https://dashboard.render.com"
      
      - name: Deployment notification
        run: |
          echo "::notice::Deployment triggered on Render. Check your Render dashboard for status."
