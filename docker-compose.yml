# YatruSathi — local/full-stack orchestration.
#
#   cp .env.example .env      # optional: override any default below
#   docker compose up --build
#
# Three tiers:
#   Presentation  frontend  →  http://localhost:${FRONTEND_PORT:-8080}   (React SPA on nginx)
#   Application   backend   →  http://localhost:${BACKEND_PORT:-8000}/api/ (Django REST API)
#   Data          db        →  postgres:5432 (published on ${POSTGRES_PORT:-5432} for psql)
#
# The chatbot is an optional AI side-car alongside the application tier.
# Chatbot   →  http://localhost:${CHATBOT_PORT:-5005}/  (AI + Socket.IO)
#
# Only the backend talks to Postgres; the browser never reaches the data tier.
#
# Supabase is an EXTERNAL managed service — it is never containerised here.
# The frontend talks to it directly from the browser using the public
# VITE_SUPABASE_* values; leave them blank to run without Supabase features.

name: yatrusathi

services:
  # ───────────────────────────  Postgres (data tier)  ──────────────────
  # Reached only from inside the compose network by the backend. The host
  # port publish is a convenience for psql/GUI clients — drop it to close
  # the database off entirely.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yatrusathi}
      POSTGRES_USER: ${POSTGRES_USER:-yatrusathi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yatrusathi-dev-password}
      # Keeps initdb deterministic across host locales.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yatrusathi
    healthcheck:
      # `pg_isready` answers during initdb's temporary server too, so match the
      # real database and user to avoid starting the backend a moment too early.
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yatrusathi} -d ${POSTGRES_DB:-yatrusathi}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ─────────────────────────────  Django API  ──────────────────────────
  backend:
    build:
      context: ./-yatrubackend-
    image: yatrusathi-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      # Core Django — no secrets are baked in; these come from the shell/.env.
      SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-compose-dev-key-change-me}
      DEBUG: ${DJANGO_DEBUG:-True}
      ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}
      # The browser origin the SPA is served from must be allowed for API + CSRF.
      CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8080}}
      CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:${FRONTEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8080}}
      # Never force an HTTPS redirect on the plain-HTTP compose stack.
      SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      # Data tier. `db` is the compose service hostname; the password is
      # interpolated from the same variables the db service is created with.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-yatrusathi}:${POSTGRES_PASSWORD:-yatrusathi-dev-password}@db:5432/${POSTGRES_DB:-yatrusathi}}
      # No TLS on the container-network hop to the local db service.
      DB_SSL_REQUIRE: ${DB_SSL_REQUIRE:-False}
      # Optional built-in admin account (admin login stays 503 until set).
      ADMIN_EMAIL: ${DJANGO_ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${DJANGO_ADMIN_PASSWORD:-}
      # Optional transactional email (OTP). Blank ⇒ console/no-op.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      # Gunicorn worker count.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      # Error tracking. Blank ⇒ disabled.
      SENTRY_DSN: ${SENTRY_DSN_BACKEND:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_media:/app/media     # user uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yatrusathi
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request as u
          r = u.Request("http://127.0.0.1:8000/api/", headers={"X-Forwarded-Proto": "https"})
          sys.exit(0 if u.urlopen(r, timeout=4).status < 500 else 1)
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # ───────────────────────────  Flask AI service  ─────────────────────
  chatbot:
    build:
      context: ./-Yatrusathi-AIchatbot
    image: yatrusathi-chatbot:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      # Flask session signing — no secret is baked into the image.
      SECRET_KEY: ${CHATBOT_SECRET_KEY:-yatrusathi-insecure-compose-dev-key-change-me}
      # Groq Cloud. Blank ⇒ the service still runs, answering from the
      # bundled knowledge base with templated responses.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      # Optional non-blocking chat logging. Blank ⇒ disabled.
      SUPABASE_URL: ${CHATBOT_SUPABASE_URL:-}
      SUPABASE_KEY: ${CHATBOT_SUPABASE_KEY:-}
      # Error tracking. Blank ⇒ disabled.
      SENTRY_DSN: ${SENTRY_DSN_CHATBOT:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      # Socket.IO message queue. Blank ⇒ single-process rooms.
      REDIS_URL: ${CHATBOT_REDIS_URL:-}
    ports:
      - "${CHATBOT_PORT:-5005}:5005"
    networks:
      - yatrusathi
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request as u
          sys.exit(0 if u.urlopen("http://127.0.0.1:5005/health", timeout=4).status < 400 else 1)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ───────────────────────────  React frontend  ───────────────────────
  frontend:
    build:
      context: ./-yatruSathiFrontend-
      args:
        # Baked into the bundle at build time. This URL is used by the user's
        # BROWSER, so it must be the host-published backend address — not the
        # `backend` compose hostname.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8000}/api/}
        # Reached by the user's BROWSER, so it's the host-published chatbot
        # address — not the `chatbot` compose hostname.
        VITE_CHATBOT_URL: ${VITE_CHATBOT_URL:-http://localhost:${CHATBOT_PORT:-5005}}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        # Error tracking. Blank ⇒ disabled.
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    image: yatrusathi-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      chatbot:
        condition: service_healthy
    networks:
      - yatrusathi
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

networks:
  yatrusathi:
    driver: bridge

volumes:
  postgres_data:   # Postgres data directory — survives `down`, not `down -v`
  backend_media:   # user uploads
