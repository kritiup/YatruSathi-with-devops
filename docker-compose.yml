# YatruSathi — local/full-stack orchestration.
#
#   cp .env.example .env      # optional: override any default below
#   docker compose up --build
#
# Frontend  →  http://localhost:${FRONTEND_PORT:-8080}
# Backend   →  http://localhost:${BACKEND_PORT:-8000}/api/
#
# Supabase is an EXTERNAL managed service — it is never containerised here.
# The frontend talks to it directly from the browser using the public
# VITE_SUPABASE_* values; leave them blank to run without Supabase features.

name: yatrusathi

services:
  # ─────────────────────────────  Django API  ──────────────────────────
  backend:
    build:
      context: ./-yatrubackend-
    image: yatrusathi-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      # Core Django — no secrets are baked in; these come from the shell/.env.
      SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-compose-dev-key-change-me}
      DEBUG: ${DJANGO_DEBUG:-True}
      ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}
      # The browser origin the SPA is served from must be allowed for API + CSRF.
      CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8080}}
      CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:${FRONTEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8080}}
      # Never force an HTTPS redirect on the plain-HTTP compose stack.
      SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      # SQLite lives on a named volume so data survives `down`/`up`.
      SQLITE_PATH: /app/data/db.sqlite3
      # Optional built-in admin account (admin login stays 503 until set).
      ADMIN_EMAIL: ${DJANGO_ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${DJANGO_ADMIN_PASSWORD:-}
      # Optional transactional email (OTP). Blank ⇒ console/no-op.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      # Gunicorn worker count.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_data:/app/data      # db.sqlite3
      - backend_media:/app/media     # user uploads
    networks:
      - yatrusathi
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request as u
          r = u.Request("http://127.0.0.1:8000/api/", headers={"X-Forwarded-Proto": "https"})
          sys.exit(0 if u.urlopen(r, timeout=4).status < 500 else 1)
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # ───────────────────────────  React frontend  ───────────────────────
  frontend:
    build:
      context: ./-yatruSathiFrontend-
      args:
        # Baked into the bundle at build time. This URL is used by the user's
        # BROWSER, so it must be the host-published backend address — not the
        # `backend` compose hostname.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8000}/api/}
        VITE_CHATBOT_URL: ${VITE_CHATBOT_URL:-}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    image: yatrusathi-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - yatrusathi
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

networks:
  yatrusathi:
    driver: bridge

volumes:
  backend_data:
  backend_media:
