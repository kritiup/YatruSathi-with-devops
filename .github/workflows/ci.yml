name: CI

# Runs on every push and pull request. No deployment here.
on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the pipeline only needs to read the repo. No secrets are used.
permissions:
  contents: read

jobs:
  # ── Frontend: install → lint → type-check → test → build ───────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./-yatruSathiFrontend-
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22" # current LTS; matches the frontend Dockerfile build stage

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # ── Backend: install → Django check → migrations check → lint → tests ──
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./-yatrubackend-
    env:
      # Placeholder value — required for settings to import, not a real secret.
      SECRET_KEY: ci-not-a-real-secret
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13" # matches the backend Dockerfile

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Lint (flake8)
        run: flake8 backend event

      - name: Tests (pytest)
        run: pytest

  # ── Docker images: only if frontend and backend pass ──────────────────
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v5

      - name: Build backend and frontend images
        # Reuses docker-compose.yml build contexts/args. Nothing is pushed.
        run: docker compose build
