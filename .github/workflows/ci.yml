name: CI

# On every push / PR: build, test and scan all three services.
# On push to main only: push images to ECR and roll them out to EKS
# (those two jobs request id-token: write for OIDC — see below).
on:
  push:
  pull_request:
  workflow_dispatch:

# Default for every job; the publish/deploy jobs widen this themselves.
permissions:
  contents: read

jobs:
  # ── Frontend: install → lint → type-check → test → build ───────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./-yatruSathiFrontend-
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22" # current LTS; matches the frontend Dockerfile build stage
          cache: npm
          cache-dependency-path: ./-yatruSathiFrontend-/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (informational)
        run: npm audit --audit-level=high || true

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # ── Backend: install → Django check → migrations check → lint → tests ──
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./-yatrubackend-
    env:
      # Placeholder value — required for settings to import, not a real secret.
      SECRET_KEY: ci-not-a-real-secret
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13" # matches the backend Dockerfile
          cache: pip
          cache-dependency-path: ./-yatrubackend-/requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Lint (flake8)
        run: flake8 backend event

      - name: Tests (pytest)
        run: pytest

  # ── Chatbot: install → lint (bug-level) → import smoke test ───────────
  chatbot:
    name: Chatbot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./-Yatrusathi-AIchatbot
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13" # matches the chatbot Dockerfile
          cache: pip
          cache-dependency-path: ./-Yatrusathi-AIchatbot/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8==7.3.0

      # Hard gate: syntax errors and undefined names only. The bundled
      # knowledge base is large, vendored data-style code — full style
      # rules run below as a report, not a merge gate.
      - name: Lint (flake8 — bug-level)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint (flake8 — full, informational)
        run: flake8 . --count --exit-zero --statistics

      - name: Import smoke test
        run: python -c "import app, chatbot, knowledge_base"

  # ── Secret scan: fail the build if a credential is committed ──────────
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so new commits on a PR are all scanned
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ── Dockerfile lint ─────────────────────────────────────────────────
  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - ./-yatrubackend-/Dockerfile
          - ./-yatruSathiFrontend-/Dockerfile
          - ./-Yatrusathi-AIchatbot/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          # DL3008/DL3013: base images here don't pin OS/pip packages by design.
          ignore: DL3008,DL3013,DL3018
          failure-threshold: warning

  # ── Security: dependency + image scanning (only if the app builds pass) ──
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: [frontend, backend, chatbot]
    env:
      # Pull Trivy's vuln DB from the ECR mirror — avoids anonymous GHCR rate limits.
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
    steps:
      - uses: actions/checkout@v5

      # Dependency vulnerabilities from the lockfiles (npm + pip). Reported only:
      # app-dependency CVEs are tracked via Dependabot, not a hard merge gate.
      - name: Trivy — dependency scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      # Build both images (also validates docker-compose.yml). --pull picks up
      # patched base layers so the scans below don't trip on stale bases.
      - name: Build backend and frontend images
        run: docker compose build --pull

      # Image vulnerabilities. A HIGH/CRITICAL that has a fix available fails
      # the pipeline; unfixed ones are ignored (nothing to act on).
      - name: Trivy — backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: yatrusathi-backend:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy — frontend image
        if: ${{ !cancelled() }} # still scan the frontend if the backend scan failed
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: yatrusathi-frontend:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy — chatbot image
        if: ${{ !cancelled() }} # scan regardless of earlier image-scan results
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: yatrusathi-chatbot:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ── Publish: push images to Amazon ECR ───────────────────────────────
  # Runs only after frontend + backend + chatbot + security all pass, and
  # only for pushes to main (never for pull requests — fork PRs cannot get
  # an OIDC token for this repo). Auth is a short-lived token from GitHub's
  # OIDC provider assuming an IAM role — no static keys in GitHub Secrets.
  push-ecr:
    name: Push to ECR
    runs-on: ubuntu-latest
    needs: [security]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      id-token: write # required for OIDC federation
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      # Rebuild all three images (this job has its own runner). Same build the
      # security job scanned: compose tags them yatrusathi-<svc>:local.
      - name: Build images
        run: docker compose build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tag every build with the commit SHA (immutable); also move :latest
      # (this job only runs on main, so :latest always tracks main).
      - name: Tag and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for svc in frontend backend chatbot; do
            src="yatrusathi-${svc}:local"
            dst="${REGISTRY}/yatru-sathi-${svc}"
            docker tag "${src}" "${dst}:${SHA}"
            docker tag "${src}" "${dst}:latest"
            docker push "${dst}:${SHA}"
            docker push "${dst}:latest"
          done

  # ── Deploy → staging ────────────────────────────────────────────────
  # Every push to main that got through push-ecr lands in the staging
  # namespace automatically. Assumes infra/terraform/ is applied and the
  # deploy role has EKS access entries for both namespaces (see eks.tf).
  deploy-staging:
    name: Deploy → staging
    runs-on: ubuntu-latest
    needs: [push-ecr]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      id-token: write
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'yatrusathi' }}
      OVERLAY: k8s/overlays/staging
      NAMESPACE: yatrusathi-staging
      ENV_NAME: staging
      SHA: ${{ github.sha }}
      APP_HOST: ${{ vars.STAGING_HOST }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install kubectl + kustomize
        run: |
          curl -sSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.31.3/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s 5.4.3 /usr/local/bin
      - name: Deploy
        run: bash .github/scripts/deploy-eks.sh

  # ── Deploy → production ────────────────────────────────────────────
  # Manual promotion only: run the workflow from the Actions tab
  # (workflow_dispatch). Add required reviewers to the "production"
  # GitHub Environment to gate it further.
  deploy-production:
    name: Deploy → production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'yatrusathi' }}
      OVERLAY: k8s/overlays/production
      NAMESPACE: yatrusathi
      ENV_NAME: production
      SHA: ${{ github.sha }}
      APP_HOST: ${{ vars.PRODUCTION_HOST }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install kubectl + kustomize
        run: |
          curl -sSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.31.3/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s 5.4.3 /usr/local/bin
      - name: Deploy
        run: bash .github/scripts/deploy-eks.sh
